SPECIFICATION Spec
CONSTANTS
  Nodes = {"A", "B"}
  Decls = {"old", "new", "revert"}
  Names = {"value"}
  Name <- CaseName
  Deps <- CaseDeps
  Ancestors <- CaseAncestors
  Valid = {"old", "new", "revert"}
  Exportable <- CaseExportable
  CollisionLeft = "old"
  CollisionRight = "new"
INVARIANTS TypeOK AdmissionSafety SnapshotSafety CollisionSafety RevertIsNewHead NoFalseCollision
CHECK_DEADLOCK FALSE
