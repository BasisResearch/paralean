SPECIFICATION Spec
CONSTANTS
  Nodes = {"A", "B"}
  Decls = {"old", "new", "proof"}
  Names = {"value", "lemma"}
  Name <- CaseName
  Deps <- CaseDeps
  Ancestors <- CaseAncestors
  Valid = {"old", "new", "proof"}
  Exportable <- CaseExportable
  CollisionLeft = "old"
  CollisionRight = "new"
INVARIANTS TypeOK AdmissionSafety SnapshotSafety CollisionSafety NoRetargeting
CHECK_DEADLOCK FALSE
