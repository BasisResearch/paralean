\* Pending state: a stages a1 and then a4, which it may anchor at a1 while a1
\* is still pending; b1 collides with a1 on foo; c only receives.
SPECIFICATION FairSpec
CONSTANTS
  Agents = {"a", "b", "c"}
  Decls = {"a1", "a4", "b1"}
  Files = {"F"}
  Names = {"foo", "bar", "baz"}
  Author <- CaseAuthor
  File <- CaseFile
  Name <- CaseName
  Also <- CaseAlso
  Rev <- CaseRev
  Tomb <- CaseTomb
  Rank <- CaseRank
INVARIANTS TypeOK KeysUnique ClockCovers AnchorClosed PendingAnchor CarriedPathAgrees SameKnownSameRender NameAgreement AnchorBefore NoSupersededRendered NamesUnique NameHeld RenderComplete
PROPERTIES RenderStable DisappearOnlySuperseded IntentionPreserved WinnerLineageKeepsName EventuallyIdentical
CHECK_DEADLOCK FALSE
