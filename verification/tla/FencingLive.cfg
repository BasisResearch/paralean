\* Liveness instance: no symmetry reduction (unsound for liveness in TLC).
\* Records a (token 1) and its token-3 child d cover a parent whose writer
\* is fenced out before committing it.
SPECIFICATION FairSpec
CONSTANTS
  Replicas = {r1, r2, r3}
  Records = {"a", "d"}
  Writers = {"old", "new"}
  Token <- CaseToken
  Parent <- CaseParent
INVARIANTS TypeOK StaleNeverStored CertFenced KnownFenced ScanFindsCertified
PROPERTY RecoveryAdopts
CHECK_DEADLOCK FALSE
