[package]
name = "paralean-control"
version.workspace = true
edition.workspace = true
license.workspace = true
workspace = "../../../p2"
description = "Paralean P3 control plane: validators, the controller and workers"

[lib]
name = "paralean_control"

[[bin]]
name = "paralean-p3"
path = "src/main.rs"

[dependencies]
paralean-store = { path = "../../../p2/crates/store" }
paralean-validator-api = { path = "../validator-api" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
libc = "0.2"
rand = "0.8"
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }

[features]
# Guard-removal mutations for impl/p3/scripts/check-mutations.sh; never enable otherwise.
mutate-no-dispatch-owner-check = []
mutate-no-request-dedup = []
mutate-validator-skips-dep-check = []
# An earlier receipt of another atomic batch serves a batch job as a dependency.
mutate-validator-cross-batch-dependency = []
mutate-validator-ignores-axioms = []
mutate-relaxed-envelope-sig = []
mutate-no-statement-stamp = []
mutate-no-checker-sandbox = []
mutate-no-checker-seccomp = []
mutate-no-checker-disk-limit = []
mutate-no-checker-process-limit = []
mutate-no-checker-memory-limit = []
mutate-no-checker-cpu-limit = []
mutate-no-checker-cgroup = []
mutate-no-checker-fsize-limit = []
mutate-checker-seccomp-allows-io-uring = []
mutate-checker-config-unsandboxed = []
mutate-checker-fallback-unsandboxed = []
mutate-unbounded-checker-output = []
mutate-drop-invalid-axiom = []
mutate-unbounded-completed-slots = []
mutate-no-lease-reassign = []
mutate-unbounded-rpc = []
mutate-no-rpc-deadline = []
mutate-shared-rpc-pool = []
mutate-no-per-source-admission = []
mutate-unchecked-gid = []
mutate-unscoped-validator-slots = []
# W2-32 over the merged W4 catalog: J1-J3 keys and the validation shard routes unscoped.
mutate-unscoped-job-keys = ["paralean-store/mutate-unscoped-job-keys"]
# W2-41: the controller binary leaves snapshot/history GC off unless --gc.
mutate-gc-off-by-default = []
# W2-55: the bwrap root tmpfs stays writable.
mutate-writable-sandbox-root = []
# W2-13: the verdict comes from the capsule-elaborating process (no kernel-check).
mutate-verdict-from-frontend = []
mutate-attached-validation = []
mutate-shared-workdir = []
mutate-role-keys-unchecked = []
mutate-validator-checks-issuer-targets = []
mutate-recover-every-tick = []
mutate-unbounded-poll-responses = []
mutate-no-work-gc = []
mutate-no-unowned-reassign = []
mutate-history-no-work-replay = []
mutate-history-no-poll-replay = []
mutate-history-no-cancel-overlay = []
mutate-history-no-grace = []
mutate-history-no-term-fence = []
mutate-history-omit-work-marker = []
mutate-history-omit-poll-marker = []
mutate-history-no-fair-scan = []
mutate-history-prune-active = []
mutate-history-no-opt-in = []
mutate-history-no-work-identity = []
mutate-history-no-poll-worker = []
mutate-history-no-row-conflict = []
mutate-history-no-terminal-grace = []
mutate-history-no-poll-epoch = []
mutate-no-term-fence = []
mutate-no-logical-expiry = []
mutate-no-shard-catalog = []
mutate-no-task-claim-check = []
mutate-no-shard-topology = []
mutate-no-validation-catalog = []
mutate-no-receipt-shard-check = []
mutate-gc-no-head-check = []
mutate-gc-no-retention-check = []
mutate-gc-no-grace-check = []
mutate-gc-no-opt-in-check = []
mutate-gc-no-candidate-check = []
mutate-gc-modulo-schedule = []
# W4-rest design 3 (replay horizons): impl/p3/scripts/check-w4r-replay-mutations.sh.
mutate-replay-accept-g-minus-2 = []
mutate-replay-accept-legacy = []
mutate-replay-retire-g-minus-1 = []
mutate-replay-retire-no-grace = []
mutate-replay-retire-no-fence = []
mutate-replay-advance-no-fence = []
mutate-replay-retire-gen0 = []
mutate-replay-dedupe-ignores-generation = []
mutate-replay-poll-token-unchecked = []

[dev-dependencies]
libtest-mimic = "0.8.2"
paralean-store = { path = "../../../p2/crates/store", features = ["adversary"] }

[[test]]
name = "adversarial"
harness = false

[[test]]
name = "atomic_batches"
harness = false

[[test]]
name = "auth"
harness = false

[[test]]
name = "batch_warm"
harness = false

[[test]]
name = "control"
harness = false

[[test]]
name = "durable"
harness = false

[[test]]
name = "fork"
harness = false

[[test]]
name = "gc"
harness = false

[[test]]
name = "mathlib_throughput"
harness = false

[[test]]
name = "measure"
harness = false

[[test]]
name = "p5_claims"
harness = false

[[test]]
name = "processes"
harness = false

[[test]]
name = "strict_signatures"
harness = false

[[test]]
name = "targets"
harness = false

[[test]]
name = "w4_dependencies"
harness = false

[[test]]
name = "w4_history"
harness = false

[[test]]
