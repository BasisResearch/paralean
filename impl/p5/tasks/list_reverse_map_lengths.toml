# Small List API development: generic map-length invariant, eight parallel reverse/map
 # specializations, and one theorem collecting their checked results.

[task]
id = "list-reverse-map-lengths-v1"
name = "Length invariants of reverse then map"

[controller]
workers = 8
max_attempts = 3

[worker]
kind = "codex"

[[targets]]
name = "P5List.map_length"
statement = "∀ (α β : Type) (f : α → β) (xs : List α), (xs.map f).length = xs.length"
file = "MapLength.lean"
deps = []

[[targets]]
name = "P5List.reverse_map_len_1"
statement = "∀ xs : List Nat, ((xs.reverse).map (fun n => n + 1)).length = xs.length"
instructions = "Use P5List.map_length Nat Nat (fun n => n + 1) xs.reverse, then List.length_reverse."
file = "ReverseMap1.lean"
deps = ["P5List.map_length"]

