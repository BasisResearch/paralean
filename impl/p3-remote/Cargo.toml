[package]
name = "paralean-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
workspace = "../p2"
description = "P3 transparent remote imports: moves packages, receipts, publication records and tombstones between working copies and the P2 store"

[[bin]]
name = "plr"
path = "src/main.rs"

[dependencies]
paralean-store = { path = "../p2/crates/store" }
paralean-validator-api = { path = "../p3/crates/validator-api" }
paralean-control = { path = "../p3/crates/control" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
