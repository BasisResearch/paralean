[package]
name = "paralean-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paralean P2 store: FoundationDB metadata (API 730) and S3-compatible payloads"

[lib]
name = "paralean_store"

[dependencies]
tokio.workspace = true
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-smithy-types = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Test corruption at rest over Garage's private socket (s3::garage_direct).
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
paralean-crypto = { path = "../crypto" }
rand = "0.8"
thiserror = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Guard-removal mutations for scripts/check-mutations.sh. Each deletes one guard; the named
# tests must then fail. Never enable them otherwise.
mutate-no-owner-check = []
mutate-no-epoch-fence = []
mutate-no-head-cas = []
mutate-cert-outside-publish = []
mutate-unfenced-commit = []
mutate-no-parent-check = []
# P3 receipt-binding mutations (impl/p3/scripts/check-mutations.sh).
mutate-no-receipt-check = []
mutate-no-revocation-check = []
mutate-no-cancel-check = []
mutate-no-undeclared-target = []
mutate-no-epoch-binding = []
mutate-issuer-signs-targets = []
# Exposes `Writer::publish_skipping_staging_check` for P3's adversarial tests. Never enable
# it in a deployment.
adversary = []
mutate-tombstone-cert-outside = []
mutate-tombstone-no-target-check = []
mutate-tombstone-no-author-check = []
mutate-tombstone-raw-scan = []
mutate-render-ignores-tombstones = []
mutate-render-ignores-supersession = []
mutate-receive-unverified-certs = []
mutate-receive-foreign-cert = []
mutate-receive-overwrite-marker = []
mutate-receive-no-payload-ack = []
# Receipt binding across deployments (merge of p2-rest with p3-control).
mutate-receive-no-receipt-check = []
mutate-public-key-file = []
mutate-weak-signature = []
# Per-path strict-verification removal (sign::verify_path); one path each.
mutate-relaxed-receipt-sig = []
mutate-relaxed-import-sig = []
mutate-key-debug = []
mutate-unbounded-pce = []
mutate-unbounded-s3-read = []
# W2 A-2: T9 omits the issuer's cancellation read / T1's dependency guard.
mutate-receive-no-cancel-check = []
mutate-receive-no-dep-check = []
# W2 A-12: ae_save_progress admits parts without the per-event part/inline caps, or
# without the per-event declared object caps, or without the per-source one.
mutate-ae-unbounded-parts = []
mutate-ae-unbounded-objects = []
mutate-ae-unbounded-source = []

[dev-dependencies]
proptest = "1"
