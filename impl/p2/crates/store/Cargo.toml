[package]
name = "paralean-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paralean P2 store: FoundationDB metadata (API 730) and S3-compatible payloads"

[lib]
name = "paralean_store"

[dependencies]
tokio.workspace = true
foundationdb = { version = "0.11", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-smithy-types = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Test corruption at rest over Garage's private socket (s3::garage_direct).
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
paralean-crypto = { path = "../crypto" }
rand = "0.8"
thiserror = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Guard-removal mutations for scripts/check-mutations.sh. Each deletes one guard; the named
# tests must then fail. Never enable them otherwise.
mutate-no-owner-check = []
mutate-no-epoch-fence = []
mutate-no-head-cas = []
mutate-cert-outside-publish = []
mutate-unfenced-commit = []
mutate-no-parent-check = []
# P3 receipt-binding mutations (impl/p3/scripts/check-mutations.sh).
mutate-no-receipt-check = []
mutate-no-revocation-check = []
mutate-no-cancel-check = []
mutate-no-undeclared-target = []
mutate-no-epoch-binding = []
mutate-issuer-signs-targets = []
# P3 job records (J1–J3) keyed by request only, not by (workspace, request).
mutate-unscoped-job-keys = []
# Exposes `Writer::publish_skipping_staging_check` for P3's adversarial tests. Never enable
# it in a deployment.
adversary = []
mutate-tombstone-cert-outside = []
mutate-tombstone-no-target-check = []
mutate-tombstone-no-author-check = []
mutate-tombstone-raw-scan = []
mutate-render-ignores-tombstones = []
mutate-render-ignores-supersession = []
mutate-receive-unverified-certs = []
mutate-receive-foreign-cert = []
mutate-receive-overwrite-marker = []
mutate-receive-no-payload-ack = []
# Receipt binding across deployments (merge of p2-rest with p3-control).
mutate-receive-no-receipt-check = []
mutate-public-key-file = []
mutate-weak-signature = []
# Per-path strict-verification removal (sign::verify_path); one path each.
mutate-relaxed-receipt-sig = []
mutate-relaxed-import-sig = []
# Atomic batch publication (docs/atomic-pub-log.md): one guard each.
mutate-relaxed-batch-sig = []
mutate-batch-unsigned-intent = []
mutate-batch-unchecked-members = []
mutate-batch-partial-commit = []
mutate-batch-member-alone = []
mutate-receive-batch-member = []
mutate-batch-scan-no-closure = []
mutate-batch-ae-partial = []
# W3's agent-key registry and controller deletion, one strict-verification path each.
mutate-relaxed-agent-grant-sig = []
mutate-relaxed-agent-revocation-sig = []
mutate-relaxed-controller-delete-sig = []
# W2-54: T9 import errors (instead of rejecting) on a group with no valid author certificate.
mutate-author-cert-error = []
mutate-key-debug = []
mutate-unbounded-pce = []
mutate-unbounded-s3-read = []
# W2 A-2: T9 omits the issuer's cancellation read / T1's dependency guard.
mutate-receive-no-cancel-check = []
mutate-receive-no-dep-check = []
# W2 A-4: T1 does not compare the job's target statement with the pinned one.
mutate-no-statement-pin-check = []
# W2 A-12: ae_save_progress admits parts without the per-event part/inline caps, or
# without the per-event declared object caps, or without the per-source one.
mutate-ae-unbounded-parts = []
mutate-ae-unbounded-objects = []
mutate-ae-unbounded-source = []
# W2 A-6: the marker/tombstone relative source-path rule (objects::check_file_path).
mutate-unchecked-file-path = []
# W2 A-6: the worker-side T1 publish check of a constructed marker (Writer::check_package).
mutate-unchecked-publish-path = []
# Process lifecycle mutation: `meta::shutdown` becomes a no-op. The deterministic
# subprocess exit test detects the missing stop/join; the old stress-worker crash is
# still not attributed to this bug without a stack.
mutate-no-network-shutdown = []
mutate-catalogue-no-source-proof = []
mutate-catalogue-no-token-proof = []
mutate-catalogue-no-parent = []
mutate-catalogue-no-object-proof = []
mutate-checkpoint-no-buildable = []
mutate-checkpoint-no-current = []
mutate-checkpoint-partial-group = []
mutate-checkpoint-no-deps = []
mutate-no-agent-registry = []
mutate-no-controller-fence = []
mutate-agent-no-revocation = []
mutate-agent-foreign-rotation = []
mutate-agent-historical-t8 = []
mutate-controller-no-source = []
mutate-controller-no-origin = []
mutate-position-group-wide-delete = []
mutate-position-receive-conflict = []
mutate-position-no-tombstone-guard = []
mutate-position-bad-root = []
mutate-position-no-anchor = []
mutate-position-lineage = []
mutate-position-cross-file = []
mutate-position-author = []
# W4-rest store GC (src/gc.rs; scripts/check-w4r-gc-mutations.sh): one removed guard each.
mutate-storegc-doom-no-ref-check = []
mutate-storegc-doom-no-grace = []
mutate-storegc-doom-no-ocert-clear = []
mutate-storegc-t1-no-doomed-check = []
mutate-storegc-ref-no-gone-check = []
mutate-storegc-t6-no-doomed-check = []
mutate-storegc-ae-serves-gone = []
mutate-storegc-retire-no-fence-check = []
mutate-storegc-job-release-no-check = []
mutate-storegc-ae-pending-no-ref = []
# Atomic batches under store GC: T12/T13 without the batch record's references; with the
# members' own references off in batch mode too; publish_batch without revival.
mutate-storegc-batch-no-record-ref = []
mutate-storegc-batch-no-member-refs = []
mutate-storegc-batch-no-revival = []

[dev-dependencies]
proptest = "1"
libtest-mimic = "0.8.2"

# FDB's network thread must be stopped while Rust is still running. The stock
# libtest main has no end-of-suite hook, so these FDB integration suites supply one.
[[test]]
name = "fixtures"
harness = false

[[test]]
name = "guards"
harness = false

[[test]]
name = "tombstones"
harness = false

[[test]]
name = "faults"
harness = false

[[test]]
name = "property"
harness = false

[[test]]
name = "antientropy"
harness = false

[[test]]
name = "strict_signatures"
harness = false

[[test]]
name = "file_paths"
harness = false

[[test]]
name = "authority"
harness = false

[[test]]
name = "positions"
harness = false

[[test]]
name = "batches"
harness = false

[[test]]
name = "store_gc"
harness = false
