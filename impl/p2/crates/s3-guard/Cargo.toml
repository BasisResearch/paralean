[package]
name = "s3-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plain S3 passthrough that refuses deletes (store.md: the bucket denies DeleteObject)"

[dependencies]
tokio.workspace = true
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"

[features]
# Guard-removal mutations: W2's (allow-delete, unbounded-body, allow-overwrite) and W4's GC
# principal cases, all for scripts/check-s3-guard-mutations.sh.
mutate-allow-delete = []
mutate-unbounded-body = []
mutate-allow-overwrite = []
mutate-no-gc-principal-check = []
mutate-no-bucket-delete-check = []
mutate-no-query-key-decode = []
mutate-no-gc-prefix-check = []
